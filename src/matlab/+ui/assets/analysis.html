<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#07577c;background:#fff}.page{height:100%;padding:26px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e5e7;padding-bottom:18px}.head h2{margin:0;font-size:21px}.head span{color:#819099;font-size:13px}.plot{height:calc(100% - 142px);margin-top:20px;border:1px solid #e1e5e7;position:relative}.plot svg{width:100%;height:100%}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:22px}.metric{border-top:3px solid #e7f1f5;padding-top:12px}.metric small{display:block;color:#819099;font-size:13px}.metric strong{display:block;margin-top:7px;font-size:22px}
</style></head><body><main class="page"><header class="head"><h2>轮廓与中心线分析</h2><span>MATLAB GPU · DVS 单相机</span></header><div class="plot"><svg id="plot" viewBox="0 0 660 290" preserveAspectRatio="none"><path id="line" d="" fill="none" stroke="#075d83" stroke-width="4"/><path id="outline" d="" fill="none" stroke="#64c795" stroke-width="2" stroke-dasharray="8 7"/></svg></div><section class="metrics"><div class="metric"><small>轮廓点数</small><strong id="points">--</strong></div><div class="metric"><small>中心线长度</small><strong id="length">--</strong></div><div class="metric"><small>运动状态</small><strong id="motion">--</strong></div><div class="metric"><small>识别状态</small><strong id="status">--</strong></div><div class="metric"><small>事件计数</small><strong id="events">--</strong></div><div class="metric"><small>原因</small><strong id="reason">--</strong></div></section></main><script>
function setup(htmlComponent){setInterval(()=>{const d=htmlComponent.Data||{};if(d.pointCount!==undefined)document.getElementById("points").textContent=d.pointCount;if(d.length!==undefined)document.getElementById("length").textContent=d.length;if(d.motion)document.getElementById("motion").textContent=d.motion;if(d.status)document.getElementById("status").textContent=d.status;if(d.rawEventCount!==undefined)document.getElementById("events").textContent=`${d.rawEventCount}/${d.filteredEventCount ?? "--"}`;if(d.reason)document.getElementById("reason").textContent=d.reason;if(Array.isArray(d.centerline)&&d.centerline.length){const xs=d.centerline.map((_,i)=>i/(d.centerline.length-1||1)*660);const ys=d.centerline.map(p=>290-(Number(p[1])||0));document.getElementById("line").setAttribute("d",xs.map((x,i)=>(i?"L":"M")+x+" "+ys[i]).join(" "));}},100)} 
</script></body></html>
